<aside class="sm-bar">

  <!-- Nav items -->
  <nav class="sm-nav">
    <a class="sm-item" routerLink="/home/fileupload" routerLinkActive="sm-active"
       (click)="navigatetoPage('fileupload')">
      <i class="bi bi-house-fill sm-icon"></i>
      <span class="sm-label">Home</span>
    </a>
    <a class="sm-item" routerLink="/home/users" routerLinkActive="sm-active"
       (click)="navigatetoPage('users')">
      <i class="bi bi-person-fill-gear sm-icon"></i>
      <span class="sm-label">User Management</span>
    </a>
  </nav>

  <!-- Decorative illustration -->
  <div class="sm-art" aria-hidden="true">
    <div class="sm-art-ring">
      <i class="bi bi-folder2-open sm-art-folder"></i>
    </div>
    <span class="sm-spark s1">+</span>
    <span class="sm-spark s2">✦</span>
    <span class="sm-spark s3">·</span>
    <span class="sm-spark s4">+</span>
  </div>

  <!-- Collapse -->
  <button class="sm-collapse-btn" (click)="logout($event)">
    <i class="bi bi-chevron-left"></i>
    <span>Collapse</span>
  </button>

</aside>
