<div class="hd-bar">

  <!-- Logo -->
  <div class="hd-logo">
    <img src="assets/images/ProEDox-logo.png" alt="ProEDox" class="logo-img" />
    <span class="logo-text">ProeDox</span>
  </div>

  <!-- Centre search -->
  <div class="hd-search">
    <i class="bi bi-search hd-search-icon"></i>
    <input class="hd-search-input" type="text" placeholder="Search in ProeDox..." />
    <span class="hd-search-kbd">⌘ K</span>
  </div>

  <!-- Right actions -->
  <div class="hd-right">
    <button class="hd-icon-btn" title="Notifications">
      <i class="bi bi-bell"></i>
      <span class="hd-badge">3</span>
    </button>
    <button class="hd-icon-btn" title="Logout" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
    </button>
    <div class="hd-user">
      <div class="hd-avatar">{{ name?.charAt(0)?.toUpperCase() || 'U' }}</div>
      <span class="hd-username">{{ name }}</span>
      <i class="bi bi-chevron-down hd-caret"></i>
    </div>
  </div>

</div>
