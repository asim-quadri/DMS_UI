<div class="header-shell">
  <div class="hd-logo" routerLink="/home">
    <img src="./assets/images/ProEDox-logo.png" alt="ProEDox" class="header-logo" />
    <span class="hd-brand">ProeDox</span>
  </div>

  <nav class="hd-nav" aria-label="Primary">
    <a
      class="hd-nav-item"
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      [class.hd-nav-active]="isNavActive(item)"
    >
      <i class="bi hd-nav-icon" [ngClass]="item.icon"></i>
      <span class="hd-nav-label">{{ item.title }}</span>
    </a>
  </nav>

  <div class="hd-right">
    <div class="hd-entity-wrap" *ngIf="entityList.length > 0">
      <select
        class="hd-entity-select"
        [ngModel]="selectedHeaderEntity"
        (ngModelChange)="onHeaderEntityChange($event)"
        [compareWith]="compareHeaderEntities"
      >
        <option *ngFor="let entity of entityList" [ngValue]="entity">{{ entity.entityName }}</option>
      </select>
    </div>

    <div class="hd-notification-wrap">
      <button type="button" class="hd-icon-btn" title="Notifications" (click)="toggleNotificationPopup()">
        <i class="bi bi-bell"></i>
        <span class="notification-count" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>

      <div class="notification-popup" *ngIf="showNotificationPopup">
        <div class="popup-header d-flex justify-content-between align-items-center notification-list">
          <h4 class="mb-0">Notifications</h4>
          <button class="custom-close" (click)="closeNotificationPopup()" aria-label="Close">&times;</button>
        </div>
        <div *ngIf="notifications.length > 0; else noNotifications">
          <div
            *ngFor="let notification of notifications"
            [ngClass]="{ unread: !notification.markAsRead }"
            class="notification-item d-flex align-items-center mb-2 mt-2"
          >
            <button
              class="single-notification inline-notification d-flex align-items-center w-100 text-start"
              [ngClass]="{ unread: !notification.markAsRead }"
              (click)="onNotificationClick(notification)"
            >
              <div class="notificatoin-avatar me-2">
                <img src="./assets/images/icons/avstsr.svg" class="img-fluid mt-0" alt="notification" />
              </div>
              <div class="notificatoin-content flex-grow-1">
                <p class="notification mb-0">
                  <span [innerHTML]="notification.notificationTitle"></span><br />
                  <span>{{ formatNotificationDate(notification.createdDate.toString()) }}</span>
                </p>
              </div>
              <div class="clearfix"></div>
            </button>
          </div>
        </div>
        <div class="text-center mt-3">
          <button class="btn btn-link p-0 view-all-btn" (click)="openAllNotifications()">View All</button>
        </div>
        <ng-template #noNotifications>
          <p class="mb-0 p-3">No notifications available.</p>
        </ng-template>
      </div>
    </div>

    <button type="button" class="hd-icon-btn" title="Logout" (click)="logout($event)">
      <i class="bi bi-box-arrow-right"></i>
    </button>

    <div class="hd-user">
      <div class="hd-avatar">{{ name?.charAt(0)?.toUpperCase() || 'U' }}</div>
      <span class="hd-username">{{ name }}</span>
      <i class="bi bi-chevron-down hd-caret"></i>
    </div>
  </div>

  <ng-template #allNotificationsModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title">All Notifications</h5>
      <button
        type="button"
        class="btn-close"
        aria-label="Close"
        (click)="modal.dismiss()"
      ></button>
    </div>
    <div class="modal-body" style="overflow: auto">
      <div class="row">
        <div class="col-6">
          <ng-container *ngFor="let note of allNotifications; let i = index">
            <div
              *ngIf="i % 2 === 0"
              class="d-flex align-items-center mb-2 mt-2"
            >
              <button
                class="single-notification inline-notification d-flex align-items-center w-100 text-start"
                [ngClass]="{ unread: !note.markAsRead }"
                (click)="onNotificationClick(note)"
              >
                <div class="notificatoin-avatar me-2">
                  <img
                    src="./assets/images/icons/avstsr.svg"
                    class="img-fluid mt-0"
                    alt="notification"
                  />
                </div>
                <div class="notificatoin-content flex-grow-1">
                  <p class="notification mb-0">
                    <span [innerHTML]="note.notificationTitle"></span><br />
                    <span>{{
                      formatNotificationDate(note.createdDate.toString())
                    }}</span>
                  </p>
                </div>
              </button>
            </div>
          </ng-container>
        </div>
        <div class="col-6">
          <ng-container *ngFor="let note of allNotifications; let i = index">
            <div
              *ngIf="i % 2 === 1"
              class="d-flex align-items-center mb-2 mt-2"
            >
              <button
                class="single-notification inline-notification d-flex align-items-center w-100 text-start"
                [ngClass]="{ unread: !note.markAsRead }"
                (click)="onNotificationClick(note)"
              >
                <div class="notificatoin-avatar me-2">
                  <img
                    src="./assets/images/icons/avstsr.svg"
                    class="img-fluid mt-0"
                    alt="notification"
                  />
                </div>
                <div class="notificatoin-content flex-grow-1">
                  <p class="notification mb-0">
                    <span [innerHTML]="note.notificationTitle"></span><br />
                    <span>{{
                      formatNotificationDate(note.createdDate.toString())
                    }}</span>
                  </p>
                </div>
              </button>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </ng-template>
</div>
