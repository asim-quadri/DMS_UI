<div class="login-page">
  <div class="login-shell">
    <section class="login-hero" aria-label="Welcome">
      <div class="hero-overlay"></div>
      <img src="./assets/images/login-images/login2.png" alt="Professional workspace" class="hero-image" />

      <div class="hero-content">
        <img src="./assets/images/ProEDox-logo.png" alt="ProeDox" class="hero-logo" />
        <h2>Compliance, Organized.</h2>
        <p>Securely manage files, controls, and approvals in one place.</p>
        <ul class="hero-features">
          <li>Secure</li>
          <li>Compliant</li>
          <li>Audit-ready</li>
        </ul>
      </div>
    </section>

    <section class="login-panel" aria-label="Login form">
      <div class="panel-head">
        <span class="panel-kicker">Workspace Sign In</span>
        <h1>Welcome Back</h1>
        <p>Sign in to continue to your workspace</p>
      </div>

      <form [formGroup]="formgroup" (ngSubmit)="onSubmit()" class="login-form" novalidate>
        <div class="form-block">
          <app-input-text
            [formGroup]="formgroup"
            [name]="'userId'"
            (keydown.enter)="onSubmit()"
            [placeholder]="'Enter employee ID or email'"
            [label]="'Employee ID / Email'"
            [labelClass]="'light-label'"
          ></app-input-text>
        </div>

        <div class="form-block">
          <app-input-password
            [formGroup]="formgroup"
            [name]="'password'"
            (keydown.enter)="onSubmit()"
            [placeholder]="'Enter password'"
            [label]="'Password'"
            [labelClass]="'light-label'"
          ></app-input-password>
        </div>

        <button class="btn-submit" type="submit" [disabled]="!formgroup.valid">
          <span>LOGIN</span>
          <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>

      <div class="login-foot">
        <a routerLink="/forget" class="genlink">Forgot Password?</a>
      </div>
    </section>
  </div>
</div>
<div id="cover-spin"></div>
